name: bmw_f650gs_dashboard
description: Painel digital para BMW F650GS com ECU Speeduino via Bluetooth BLE

publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE
  flutter_blue_plus: ^1.31.13

  # UI / Gauges
  syncfusion_flutter_gauges: ^25.1.41
  fl_chart: ^0.68.0

  # Estado global
  provider: ^6.1.2

  # Persistência de configurações
  shared_preferences: ^2.3.0

  # Logging de dados
  path_provider: ^2.1.3
  csv: ^6.0.0

  # Permissões (BLE)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
